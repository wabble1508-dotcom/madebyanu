<!doctype html>
<!-- Vorlage für das Vorschaubild beim Teilen (1200×630).
     Neu erzeugen: im Browser öffnen und einen Screenshot von 1200×630 machen,
     oder mit Playwright: siehe README. -->
<html lang="de">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "DM Serif Display"; src: url("../assets/fonts/dm-serif-display.woff2") format("woff2"); }
  @font-face { font-family: "DM Serif Display"; src: url("../assets/fonts/dm-serif-display-italic.woff2") format("woff2"); font-style: italic; }
  @font-face { font-family: "Figtree"; src: url("../assets/fonts/figtree-latin-wght-normal.woff2") format("woff2"); font-weight: 300 900; }
  @font-face { font-family: "Dancing Script"; src: url("../assets/fonts/dancing-script.woff2") format("woff2"); font-weight: 400 700; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { background: #f8e1e5; color: #2e221d; font-family: "Figtree", sans-serif; position: relative; }
  /* zarter Papier-Verlauf */
  body::before { content: ""; position: absolute; inset: 0; background: radial-gradient(60% 80% at 22% 40%, #fff, transparent 72%), radial-gradient(50% 60% at 100% 100%, #f1c2cc, transparent 70%); }
  .frame { position: absolute; inset: 22px; border: 1.5px solid rgba(192,145,70,.7); }
  .text { position: absolute; left: 70px; top: 0; bottom: 0; width: 520px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
  .logo { display: flex; align-items: center; font-family: "DM Serif Display", serif; font-size: 46px; font-weight: 400; }
  .logo svg { width: 54px; height: 54px; color: #a9834a; margin-left: 4px; transform: translateY(-8px); }
  .kicker { margin-top: 26px; font-size: 14px; font-weight: 700; letter-spacing: .32em; text-transform: uppercase; color: #b23a5a; }
  h1 { margin-top: 16px; font-family: "DM Serif Display", serif; font-weight: 400; font-size: 54px; line-height: 1.02; letter-spacing: -.01em; }
  h1 i { display: block; color: #b23a5a; }
  .orn { display: flex; align-items: center; gap: 14px; width: 220px; margin: 22px 0 16px; color: #a9834a; }
  .orn::before, .orn::after { content: ""; flex: 1; height: 1px; background: currentColor; }
  .tag { font-size: 15px; font-weight: 700; letter-spacing: .32em; text-transform: uppercase; color: #b23a5a; }
  .cta { margin-top: 30px; display: inline-flex; align-items: center; gap: 10px; padding: 14px 26px; background: #b23a5a; color: #fff; border-radius: 8px; font-size: 14px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; }
  .cta svg { width: 20px; height: 20px; }
  .photos { position: absolute; right: 62px; top: 58px; bottom: 58px; width: 520px; }
  .ph { position: absolute; overflow: hidden; border: 7px solid #fbf7f3; box-shadow: 0 24px 44px -22px rgba(46,34,29,.55); }
  .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .p1 { left: 0; top: 40px; width: 190px; height: 340px; transform: rotate(-3deg); }
  .p2 { left: 165px; top: 0; width: 240px; height: 330px; z-index: 2; }
  .p2 img { object-position: center 100% !important; }
  .p3 { right: 0; top: 70px; width: 175px; height: 320px; transform: rotate(3deg); }
  .p2 img { object-position: center 88%; }
  .script { position: absolute; right: 40px; bottom: 6px; font-family: "Dancing Script", cursive; font-size: 44px; font-weight: 700; color: #b23a5a; z-index: 3; }
  .price { position: absolute; left: 16px; bottom: 22px; z-index: 3; width: 118px; height: 118px; border-radius: 50%; background: #b23a5a; color: #f5ece7; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; box-shadow: 0 16px 30px -14px rgba(0,0,0,.6); }
  .price small { font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: #fde2e8; }
  .price b { font-family: "DM Serif Display", serif; font-weight: 400; font-size: 38px; line-height: 1.05; }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="text">
    <div class="logo">madebyanu.de<svg viewBox="0 0 40 40"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><g transform="rotate(38 20 20)"><path d="M20 25V38" stroke-width="2.6"/><path d="M20 25C10 17 12 2.5 20 2.5S30 17 20 25Z" stroke-width="1.3"/><path d="M20 25C15 17 16 3.5 20 2.5S25 17 20 25Z" stroke-width="1.1"/><path d="M20 25V2.5" stroke-width="1"/></g><path d="M2 33c9 3 20 2 29-5" stroke-width="1.2"/></g></svg></div>
    <p class="kicker">Handgemacht in Dortmund</p>
    <h1>Cheesecake, Tiramisu <i>&amp; Dubai Schokolade</i></h1>
    <div class="orn">✦</div>
    <p class="tag">Creamy · Dreamy · Irresistible</p>
    <p class="cta"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12.04 2.5a9.43 9.43 0 0 0-8.1 14.26L2.6 21.5l4.86-1.3A9.43 9.43 0 1 0 12.04 2.5zm0 17.2a7.75 7.75 0 0 1-3.95-1.08l-.28-.17-2.88.77.77-2.8-.18-.29a7.77 7.77 0 1 1 6.52 3.57z"/></svg>Jetzt per WhatsApp bestellen</p>
  </div>
  <div class="photos">
    <div class="ph p1"><img src="../assets/reels/tiramisu.jpg" alt=""></div>
    <div class="ph p2"><img src="../assets/reels/dubai-schokolade-hd.jpg" alt=""></div>
    <div class="ph p3"><img src="../assets/reels/dubai-brownies.jpg" alt=""></div>
    <div class="price"><small>4er Box</small><b>20 €</b></div>
    <div class="script">made with love</div>
  </div>
</body>
</html>
